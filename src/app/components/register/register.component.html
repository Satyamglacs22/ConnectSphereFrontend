<div class="register-container">
  <div class="register-card-wrapper">
    <mat-card>
      <mat-card-header>
        <mat-card-title class="text-gradient">Create Account</mat-card-title>
        <mat-card-subtitle>Join the ConnectSphere community today</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Username</mat-label>
            <input matInput formControlName="userName" placeholder="Choose a username" />
            <mat-icon matPrefix>alternate_email</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Full Name</mat-label>
            <input matInput formControlName="fullName" placeholder="Enter your full name" />
            <mat-icon matPrefix>person</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="Enter your email" />
            <mat-icon matPrefix>email</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Create a password" />
            <mat-icon matPrefix>lock</mat-icon>
          </mat-form-field>

          <button
            mat-raised-button
            color="primary"
            type="submit"
            class="full-width submit-btn"
            [disabled]="registerForm.invalid || loading"
          >
            @if (loading) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Create Account
            }
          </button>
        </form>
      </mat-card-content>

      <mat-card-actions>
        <p>Already have an account? <a routerLink="/login" class="login-link">Login here</a></p>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
