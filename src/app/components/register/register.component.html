<div class="login-wrapper">
  <!-- Left Side: Visuals & Branding -->
  <div class="left-section">
    <div class="overlay"></div>
    <div class="branding-content">
      <div class="logo-badge">
        <mat-icon>polymer</mat-icon>
        <span>ConnectSphere</span>
      </div>
      <div class="hero-text">
        <h2 class="serif-title">Start Your Journey</h2>
        <p>Join thousands of others in a digital space designed for meaningful connections.</p>
      </div>
    </div>
  </div>

  <!-- Right Side: Register Form -->
  <div class="right-section">
    <div class="form-container">
      <div class="form-header">
        <mat-icon class="mobile-logo">polymer</mat-icon>
        <h1 class="serif-title">Create Account</h1>
        <p>Fill in the details to join the ConnectSphere community</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="input-group">
          <label>Username</label>
          <div class="custom-input">
            <input type="text" formControlName="userName" placeholder="Choose a username" />
            <mat-icon>alternate_email</mat-icon>
          </div>
        </div>

        <div class="input-group">
          <label>Full Name</label>
          <div class="custom-input">
            <input type="text" formControlName="fullName" placeholder="Enter your full name" />
            <mat-icon>person</mat-icon>
          </div>
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <div class="custom-input">
            <input type="email" formControlName="email" placeholder="Enter your email" />
            <mat-icon>mail_outline</mat-icon>
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="custom-input">
            <input type="password" formControlName="password" placeholder="Create a password" />
            <mat-icon>lock</mat-icon>
          </div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || loading">
          {{ loading ? 'Creating Account...' : 'Create Account' }}
        </button>

        <div class="form-footer">
          <span>Already have an account?</span>
          <a routerLink="/login">Login here</a>
        </div>
      </form>
    </div>
  </div>
</div>
